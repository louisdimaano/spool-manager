<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>SpoolManager</title>
</head>

<body>
    <h1>My Spools</h1>
    <p><a href="{{ url_for('add_spool') }}">+ Add spool</a></p>

    {% if spools %}
    <table>
        <thead>
            <tr>
                <th>Brand</th>
                <th>Material</th>
                <th>Color</th>
                <th>Left</th>
                <th></th>
            </tr>
        </thead>
        <tbody>
            {% for spool in spools %}
            <tr>
                <td>{{ spool.brand }}</td>
                <td>{{ spool.material }}</td>
                <td>{{ spool.color }}</td>
                <td>{{ spool.remaining_g }} g ({{ (spool.remaining_g / spool.total_g * 100) | round | int }}%)</td>
                <td><a href="{{ url_for('edit_spool', spool_id=spool.id) }}">Edit</a></td>
            </tr>
            {% endfor %}
        </tbody>
    </table>
    {% else %}
    <p>No spools yet.</p>
    {% endif %}
</body>

</html>
