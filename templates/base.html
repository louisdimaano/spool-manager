<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}SpoolManager{% endblock %}</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>

<body>
    <header class="site-header">
        <div class="site-header-inner">
            <a class="site-name" href="{{ url_for('spool_list') }}">SpoolManager</a>
            <nav>
                <a href="{{ url_for('spool_list') }}" {% if request.endpoint=='spool_list' %}aria-current="page" {%
                    endif %}>Spools</a>
                <a href="{{ url_for('add_spool') }}" {% if request.endpoint=='add_spool' %}aria-current="page" {% endif
                    %}>Add spool</a>
                <a href="{{ url_for('check') }}" {% if request.endpoint=='check' %}aria-current="page" {% endif %}>Can I
                    print this?</a>
            </nav>
        </div>
    </header>

    <main class="container">
        {% with messages = get_flashed_messages() %}
        {% if messages %}
        <div class="flash">
            {% for message in messages %}
            <p>{{ message }}</p>
            {% endfor %}
        </div>
        {% endif %}
        {% endwith %}

        {% block content %}{% endblock %}
    </main>
</body>

</html>
