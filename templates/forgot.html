{% extends "base.html" %}

{% block title %}Forgot password | SpoolManager{% endblock %}

{% block content %}
<h1>Forgot password</h1>

{% if errors %}
<div class="errors">
    {% for error in errors %}
    <p>{{ error }}</p>
    {% endfor %}
</div>
{% endif %}

<form method="post" class="card narrow">
    <p class="field"><label>Recovery code
            <input name="code" autocomplete="off" autocapitalize="characters" required
                placeholder="e.g. 7KQ4-M2XD-9PLR-F6TW"></label></p>
    <p class="field"><label>New password
            <input type="password" name="password" autocomplete="new-password" required minlength="8"></label></p>
    <p class="field"><label>Type it again
            <input type="password" name="confirm" autocomplete="new-password" required minlength="8"></label></p>
    <div class="form-actions">
        <button class="btn" type="submit">Set new password</button>
        <a class="btn btn-secondary" href="{{ url_for('login') }}">Back to log in</a>
    </div>
</form>
{% endblock %}
