<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Add a Spool | SpoolManager</title>
</head>

<body>
    <h1>Add a Spool</h1>

    {% if errors %}
    <ul>
        {% for error in errors %}
        <li>{{ error }}</li>
        {% endfor %}
    </ul>
    {% endif %}

    <form method="post">
        <p><label>Brand<br>
                <input name="brand" value="{{ form.get('brand', '') }}" required></label></p>

        <p><label>Material<br>
                <select name="material" required>
                    {% for m in materials %}
                    <option value="{{ m }}" {% if form.get('material')==m %}selected{% endif %}>{{ m }}</option>
                    {% endfor %}
                </select></label></p>

        <p><label>Color<br>
                <input name="color" value="{{ form.get('color', '') }}" required></label></p>

        <p><label>Spool size (g)<br>
                <input type="number" name="total_g" min="1" step="1" value="{{ form.get('total_g', 1000) }}"></label>
        </p>

        <p><label>Grams left<br>
                <input type="number" name="remaining_g" min="0" step="1" value="{{ form.get('remaining_g', '') }}"
                    placeholder="Leave blank if new"></label></p>

        <p><label>Cost ($)<br>
                <input type="number" name="cost" min="0" step="0.01" value="{{ form.get('cost', '') }}"></label></p>

        <p><label>CFS slot<br>
                <input name="cfs_slot" value="{{ form.get('cfs_slot', '') }}" placeholder="e.g. 1A"></label></p>

        <p><label><input type="checkbox" name="in_dry_box" {% if form.get('in_dry_box') %}checked{% endif %}>
                In dry box</label></p>

        <p><label>Backup brand<br>
                <input name="backup_brand" value="{{ form.get('backup_brand', '') }}"></label></p>

        <p><label>Notes<br>
                <textarea name="notes">{{ form.get('notes', '') }}</textarea></label></p>

        <button type="submit">Save spool</button>
        <a href="{{ url_for('spool_list') }}">Cancel</a>
    </form>
</body>

</html>
